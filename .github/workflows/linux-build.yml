name: Linux Build

# Reusable workflow: invoked by .github/workflows/release.yml.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x64 bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------
      # CMake + GTK + pkg-config 是 Flutter Linux build 的硬依赖;
      # media_kit 的 mpv 后端由 pubspec 里的 media_kit_libs_linux 提供
      # 预编译 .so,不需要系统 libmpv-dev。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            gcc \
            g++ \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            zip

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-ubuntu-

      # 只缓存 ~/.cmake(CMake 的包注册表)。
      # 不缓存 build/ —— 里面的 CMakeCache.txt 记着上一次 SDK 路径,
      # 换 Flutter 版本后复用会直接把构建搞挂,重建比复用更省事。
      - name: Cache CMake packages
        uses: actions/cache@v4
        with:
          path: ~/.cmake
          key: cmake-ubuntu-linux-x64-${{ hashFiles('**/CMakeLists.txt', '**/linux/CMakeLists.txt') }}
          restore-keys: |
            cmake-ubuntu-linux-x64-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      # flutter build linux 默认输出到 build/linux/x64/release/bundle/,
      # 含可执行文件 + lib/*.so + data/flutter_assets/ + icudtl.dat。
      # 把整个 bundle 目录打包成 tar.gz 给用户直接解压就能跑。
      - name: Build release bundle
        run: |
          flutter build linux \
            --release \
            --target-platform=linux-x64

      # ------------------------------------------------------------
      # Verify bundle
      # ------------------------------------------------------------
      - name: Verify bundle
        run: |
          BUNDLE="build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE" ]; then
            echo "::error::bundle missing at $BUNDLE"
            echo "Actual contents:"
            find build/linux -maxdepth 4 -type d -print 2>/dev/null || true
            exit 1
          fi
          echo "=== Bundle top-level ==="
          ls -lh "$BUNDLE"

          echo
          echo "=== Bundle libraries ==="
          ls -lh "$BUNDLE/lib" || true

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package artifact
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          STAGE="release-artifacts/asmr_two-linux-x64"

          rm -rf release-artifacts
          mkdir -p "$STAGE"
          cp -r "$BUNDLE"/. "$STAGE"/

          cd release-artifacts
          tar -czf asmr_two-linux-x64.tar.gz \
            asmr_two-linux-x64

          sha256sum *.tar.gz > SHA256SUMS

          echo
          echo "=== release artifacts ==="
          ls -lh

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # Upload as workflow artifact. Name is platform-scoped (no tag
      # suffix) because all 4 build jobs in the calling workflow share
      # the same workflow run — caller downloads by name.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: release-artifacts/
          retention-days: 7
